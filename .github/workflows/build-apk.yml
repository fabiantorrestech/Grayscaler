name: Build debug APK

# Builds a debug APK on every push to the working branches and on demand, so a test build can be
# downloaded straight to a phone without a PC.
#
# Where to get it:
#   - Rolling prerelease "ci-latest" on the Releases page: a direct .apk link, best on a phone.
#   - The run's "Artifacts" section: the same APK inside a zip (requires being signed in).
#
# Signing: debug and release builds use the personal release key from the PERSONAL_KEYSTORE_*
# secrets (see fabiantorrestech/android-apps), so this test build, PC builds and the released app
# install over each other. Without those secrets the build falls back to a throwaway debug key
# (or DEBUG_KEYSTORE_BASE64, if set).

on:
  push:
    branches: [improvements_branch, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: versionCode is the commit count.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gradle 8.x in this project cannot run on JDK 25+, so pin the build JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Use shared debug keystore if provided
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$HOME/.android/debug.keystore"
            echo "Using debug keystore from repository secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret: signing with a throwaway debug key."
          fi

      # The personal release key (see fabiantorrestech/android-apps), as Gradle properties.
      - name: Set up the release key
        env:
          KEYSTORE_B64: ${{ secrets.PERSONAL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.PERSONAL_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::PERSONAL_KEYSTORE_B64 not set: no signed release build"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ORG_GRADLE_PROJECT_PERSONAL_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ORG_GRADLE_PROJECT_PERSONAL_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ORG_GRADLE_PROJECT_PERSONAL_KEYSTORE_ALIAS=$KEYSTORE_ALIAS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --console=plain

      - name: Name the APK
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME//\//-}"
          out="grayscalerplus-${branch}-${short_sha}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30

      # Rolling prerelease with a direct .apk download. Skipped for pull requests, whose token is
      # read-only when they come from forks.
      - name: Publish rolling test prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.file }}
        run: |
          notes="Automated debug build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. For testing only. Replaced on every push."
          gh release delete ci-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create ci-latest "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build (${GITHUB_REF_NAME} ${{ steps.apk.outputs.short_sha }})" \
            --notes "$notes"

      # Signed release for the app hub, on pushes to master only.
      - name: Publish to the app hub (fabiantorrestech/android-apps)
        if: github.event_name == 'push' && github.ref_name == 'master'
        env:
          GH_TOKEN: ${{ secrets.APP_HUB_TOKEN }}
          HUB: fabiantorrestech/android-apps
          TAG: grayscalerplus
          NAME: GrayScaler+
          APK: GrayScalerPlus.apk
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_PERSONAL_KEYSTORE_FILE" ] || [ -z "$GH_TOKEN" ]; then
            echo "::warning::Release key or APP_HUB_TOKEN missing: not publishing to the hub"
            exit 0
          fi
          ./gradlew :app:assembleRelease --console=plain
          cp app/build/outputs/apk/release/*.apk "$APK"
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          badging="$("$aapt2" dump badging "$APK" | head -1)"
          code="$(echo "$badging" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          version="$(echo "$badging" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          title="$NAME $version ($code)"
          notes="Built by CI from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} (${GITHUB_REF_NAME}) on $(date -u '+%Y-%m-%d %H:%M') UTC."
          if gh release view "$TAG" --repo "$HUB" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$HUB" --clobber
            gh release edit "$TAG" --repo "$HUB" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" "$APK" --repo "$HUB" --target main --title "$title" --notes "$notes" --latest=false
          fi
